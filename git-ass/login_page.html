<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Sports Management</title>

<link rel="stylesheet" href="">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* ================= BODY ================= */

body{
    background:#f5f5f5;
}

/* ================= NAVBAR ================= */

.navbar{
    background:#032452;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 40px;
    min-height:80px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #f4c542;
}

.logo-text h2{
    font-size:20px;
    color:#f4c542;
    letter-spacing:0.5px;
}

.logo-text p{
    font-size:13px;
    color:#fff;
    margin-top:2px;
}

/* ================= NAV LINKS ================= */

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:500;
    font-size:15px;
    position:relative;
    transition:0.3s;
}

/* Underline effect */

.nav-links a::after{
    content:"";
    position:absolute;
    width:0;
    height:2px;
    background:#f4c542;
    left:0;
    bottom:-7px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#f4c542;
}

.nav-links a:hover::after{
    width:100%;
}


/* ================= LOGIN BACKGROUND ================= */

.login-container{
    height:700px;
    width:100%;

    background:
    linear-gradient(
        rgba(0,0,0,0.55),
        rgba(0,0,0,0.55)
    ),
    url('login-container-bg.jpeg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    margin-top:5px;
    margin-bottom:5px;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}


/* ================= LOGIN FORM BOX ================= */

.form-container{
    height:600px;
    width:400px;

    border:1px solid rgba(255,255,255,0.45);

    border-radius:18px;

    background:rgba(255,255,255,0.10);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.45),
        inset 0 0 20px rgba(255,255,255,0.05);

    padding:40px 35px;

    display:grid;
    grid-template-rows:auto 1fr auto;

    position:relative;

    color:white;
}


/* ================= WELCOME ================= */

.welcome-content{
    text-align:center;
    margin-bottom:25px;
}

.welcome-content h1{
    margin:0;
    font-size:40px;
    font-weight:700;
    color:#f4c542;

    text-shadow:
        0 3px 10px rgba(0,0,0,0.5);

    letter-spacing:1px;
}

.welcome-content p{
    color:white;
    font-size:15px;
    margin-top:8px;
}


/* ================= FORM ================= */

.form-container form{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:22px;
}


/* ================= INPUT BOX ================= */

.input-box{
    width:100%;
    height:52px;

    position:relative;

    display:flex;
    align-items:center;

    border-bottom:2px solid rgba(255,255,255,0.7);

    transition:0.3s;
}

.input-box:focus-within{
    border-bottom:2px solid #f4c542;
}


/* Input */

.input-box input{
    width:100%;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-size:15px;

    padding:0 40px 0 10px;
}

.input-box input::placeholder{
    color:rgba(255,255,255,0.85);
}


/* ================= ICON ================= */

.input-box .icon{
    width:20px;
    height:20px;

    position:absolute;
    right:10px;

    pointer-events:none;
}




.input-box:first-child .icon::before{
    content:"👤";
    font-size:18px;
}




.input-box:nth-child(2) .icon::before{
    content:"🔒";
    font-size:17px;
}


/* Eye icon */

.eye{
    position:absolute;
    right:10px;
    width:20px;
    height:20px;
    cursor:pointer;
}




.form-container button{
    width:100%;
    height:50px;

    border:none;
    border-radius:25px;

    background:#f4c542;
    color:#032452;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.3);
}

.form-container button:hover{
    background:#ffffff;

    color:#032452;

    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.4);
}

.form-container button:active{
    transform:translateY(0);
}




.Contact{
    text-align:center;
    margin-top:15px;
}




.or{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.or span{
    height:1px;
    flex:1;
    background:rgba(255,255,255,0.5);
}

.or p{
    color:white;
    font-size:14px;
}




.account{
    color:white;
    font-size:14px;
}

.account a{
    color:#f4c542;
    text-decoration:none;
    font-weight:600;
    margin-left:5px;
    transition:0.3s;
}

.account a:hover{
    color:white;
    text-decoration:underline;
}



</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">

    <div class="logo">
        <img src="Ruhuna-University-logo.png" alt="">
        <div class="logo-text">
            <h2>Sports Management</h2>
            <p>University of Ruhuna</p>
        </div>
    </div>

    <ul class="nav-links">
        <li><a href="home_page.html">Home</a></li>
        <li><a href="#">Sports</a></li>
        <li><a href="#">Events</a></li>
        <li><a href="#">Teams</a></li>
        <li><a href="#">Results</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    
</nav>
<section class="login-container">
    <div class="form-container" >
        <div  class="welcome-content">
            <h1 >WELCOME!</h1>
            <p>University of Ruhuna</p>
        </div>
        <form>
            <div class="input-box">
                <span class="icon"></span>
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-box">
                <span class="icon"></span>
                <input type="password" placeholder="Password" required>
                <span class="eye"></span>
            </div>
            <button type="submit"><span></span>LOGIN</button>
        </form>

        <div class="Contact">
            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>
            <p class="account">
                Don't have an account?
                <a href="">Contact Admin</a>
            </p>
        </div>
    </div>
</section>

</body>
</html>
